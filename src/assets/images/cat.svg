<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- 꼬리 -->
  <path d="M 140 200 Q 180 180 185 150 Q 190 130 170 125"
        stroke="#FF8C42" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- 몸통 -->
  <ellipse cx="100" cy="185" rx="55" ry="45" fill="#FF8C42"/>

  <!-- 배 (흰색) -->
  <ellipse cx="100" cy="192" rx="32" ry="30" fill="#FFF5E4"/>

  <!-- 왼쪽 다리 -->
  <rect x="65" y="218" width="18" height="20" rx="9" fill="#FF8C42"/>
  <!-- 오른쪽 다리 -->
  <rect x="117" y="218" width="18" height="20" rx="9" fill="#FF8C42"/>

  <!-- 왼쪽 발 -->
  <ellipse cx="74" cy="238" rx="11" ry="7" fill="#E07030"/>
  <!-- 오른쪽 발 -->
  <ellipse cx="126" cy="238" rx="11" ry="7" fill="#E07030"/>

  <!-- 왼쪽 팔 -->
  <ellipse cx="52" cy="178" rx="10" ry="22" fill="#FF8C42" transform="rotate(-20 52 178)"/>
  <!-- 오른쪽 팔 -->
  <ellipse cx="148" cy="178" rx="10" ry="22" fill="#FF8C42" transform="rotate(20 148 178)"/>

  <!-- 머리 -->
  <ellipse cx="100" cy="105" rx="52" ry="48" fill="#FF8C42"/>

  <!-- 왼쪽 귀 (삼각형) -->
  <polygon points="58,70 48,35 80,60" fill="#FF8C42"/>
  <!-- 왼쪽 귀 안쪽 -->
  <polygon points="60,66 52,42 76,60" fill="#FFB8B8"/>

  <!-- 오른쪽 귀 -->
  <polygon points="142,70 152,35 120,60" fill="#FF8C42"/>
  <!-- 오른쪽 귀 안쪽 -->
  <polygon points="140,66 148,42 124,60" fill="#FFB8B8"/>

  <!-- 왼쪽 눈 -->
  <ellipse cx="82" cy="100" rx="10" ry="11" fill="#2C2C2C"/>
  <ellipse cx="82" cy="99" rx="5" ry="8" fill="#111"/>
  <circle cx="85" cy="96" r="3" fill="white"/>

  <!-- 오른쪽 눈 -->
  <ellipse cx="118" cy="100" rx="10" ry="11" fill="#2C2C2C"/>
  <ellipse cx="118" cy="99" rx="5" ry="8" fill="#111"/>
  <circle cx="121" cy="96" r="3" fill="white"/>

  <!-- 코 -->
  <polygon points="100,113 95,119 105,119" fill="#FF6B9D"/>

  <!-- 입 -->
  <path d="M 95,119 Q 100,125 105,119" stroke="#555" stroke-width="1.5" fill="none"/>
  <path d="M 95,119 Q 88,124 84,122" stroke="#555" stroke-width="1.5" fill="none"/>
  <path d="M 105,119 Q 112,124 116,122" stroke="#555" stroke-width="1.5" fill="none"/>

  <!-- 왼쪽 수염 -->
  <line x1="84" y1="116" x2="50" y2="110" stroke="#888" stroke-width="1.5"/>
  <line x1="84" y1="119" x2="50" y2="119" stroke="#888" stroke-width="1.5"/>
  <line x1="84" y1="122" x2="50" y2="128" stroke="#888" stroke-width="1.5"/>

  <!-- 오른쪽 수염 -->
  <line x1="116" y1="116" x2="150" y2="110" stroke="#888" stroke-width="1.5"/>
  <line x1="116" y1="119" x2="150" y2="119" stroke="#888" stroke-width="1.5"/>
  <line x1="116" y1="122" x2="150" y2="128" stroke="#888" stroke-width="1.5"/>

  <!-- 볼 홍조 -->
  <ellipse cx="72" cy="115" rx="10" ry="7" fill="#FFB8B8" opacity="0.5"/>
  <ellipse cx="128" cy="115" rx="10" ry="7" fill="#FFB8B8" opacity="0.5"/>

  <!-- 이마 줄무늬 -->
  <path d="M 95,65 Q 100,55 105,65" stroke="#E07030" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 88,70 Q 86,60 92,68" stroke="#E07030" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 112,70 Q 114,60 108,68" stroke="#E07030" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
